backend:
  name: git-gateway
  branch: main
  
media_folder: "public/images"
public_folder: "/images"

locale: fr

collections:

  # ---------------------------------
  # ACTUALITÉS
  # ---------------------------------
  - name: "actualites"
    label: "Actualités"
    label_singular: "Article"
    folder: "src/content/actualites"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description courte", name: "description", widget: "text", hint: "Apparaît dans les cartes d'aperçu et pour le SEO/Réseaux sociaux." }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Thématique (Tag)"
        name: "tag"
        widget: "select"
        options: ["Environnement", "Économie", "Social", "Vote", "Action", "Communiqué", "Vie associative", "Événement"]
      - { label: "Image de couverture (optionnel)", name: "image", widget: "image", required: false }
      - { label: "Lien vidéo YouTube (optionnel)", name: "video_youtube", widget: "string", required: false, hint: "Collez l'URL complète (ex: https://www.youtube.com/watch?v=...)" }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false }
      - { label: "Contenu", name: "body", widget: "markdown" }

  # ---------------------------------
  # MEMBRES / ÉQUIPE
  # ---------------------------------
  - name: "membres"
    label: "Membres / Équipe"
    label_singular: "Membre"
    folder: "src/content/membres"
    create: true
    slug: "{{fields.nom | slugify}}"
    fields:
      - { label: "Nom complet", name: "nom", widget: "string" }
      - { label: "Rôle / Mandat", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 99, hint: "1 apparaîtra en premier." }
      # Ajout des réseaux sociaux (très important en politique)
      - { label: "Lien Twitter / X", name: "twitter", widget: "string", required: false }
      - { label: "Lien LinkedIn", name: "linkedin", widget: "string", required: false }
      - { label: "Lien Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Biographie", name: "body", widget: "markdown", required: false }

  # ---------------------------------
  # VALEURS
  # ---------------------------------
  - name: "valeurs"
    label: "Valeurs"
    label_singular: "Valeur"
    folder: "src/content/valeurs"
    create: true
    slug: "{{fields.titre | slugify}}"
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - { label: "Icône", name: "icone", widget: "image", required: false, hint: "Format SVG recommandé pour l'illustration." }
      - { label: "Résumé court", name: "resume", widget: "text", hint: "Texte court de 2-3 lignes affiché sur la page d'accueil." }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 99 }
      - { label: "Description détaillée", name: "body", widget: "markdown" }

  # ---------------------------------
  # PAGES STATIQUES
  # ---------------------------------
  - name: "pages"
    label: "Pages statiques"
    files:
      # PAGE ACCUEIL
      - name: "accueil"
        label: "Accueil"
        file: "src/content/pages/accueil.md" # <-- Changé en .md
        fields:
          - label: "En-tête (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Surtitre (Eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Titre principal", name: "titre", widget: "string", hint: "Tu peux utiliser <br> pour sauter une ligne et <em> pour l'italique." }
              - { label: "Texte d'introduction", name: "description", widget: "text" }
              - { label: "Bouton Primaire - Texte", name: "btn1_texte", widget: "string" }
              - { label: "Bouton Primaire - Lien", name: "btn1_lien", widget: "string" }
              - { label: "Bouton Secondaire - Texte", name: "btn2_texte", widget: "string" }
              - { label: "Bouton Secondaire - Lien", name: "btn2_lien", widget: "string" }
          
          - label: "Bandeau d'Action (Bas de page)"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Surtitre", name: "eyebrow", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Texte explicatif", name: "texte", widget: "text" }
              - { label: "Bouton - Texte", name: "btn_texte", widget: "string" }
              - { label: "Bouton - Lien", name: "btn_lien", widget: "string" }
          
          # Le champ body est requis par Decap pour les fichiers .md, même si tu ne l'utilises pas visuellement sur l'accueil
          - { label: "Contenu masqué (optionnel)", name: "body", widget: "markdown", required: false }

      # PAGE QUI SOMMES NOUS
      - name: "qui-sommes-nous"
        label: "Qui sommes-nous ?"
        file: "src/content/pages/qui-sommes-nous.json"
        fields:
          - { label: "Titre de la page", name: "titre", widget: "string" }
          - { label: "Image d'en-tête", name: "image_header", widget: "image", required: false }
          - { label: "Notre Histoire / Manifeste", name: "contenu", widget: "markdown" }

      # PAGE ADHÉRER
      - name: "adherer"
        label: "Adhérer"
        file: "src/content/pages/adherer.md"
        fields:
          - { label: "Surtitre (Eyebrow)", name: "eyebrow", widget: "string", default: "Rejoignez le mouvement" }
          - { label: "Titre de la page", name: "titre", widget: "string", default: "Soutenez notre action" }
          - { label: "Texte d'explication", name: "description", widget: "text", hint: "Expliquez la démarche ou donnez les consignes pour scanner." }
          - { label: "Image du QR Code", name: "qr_code", widget: "image", hint: "Importez l'image du QR code." }
          - { label: "Légende sous le QR Code", name: "qr_caption", widget: "string", default: "Scannez ce code avec votre téléphone" }